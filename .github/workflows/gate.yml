name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-base.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-base.lock.txt
      - name: Install Python development tools
        run: python -m pip install -r requirements-build.txt
      - name: Verify public source
        run: python build/check_source.py
      - name: Verify version markers
        run: python build/version.py --check
      - name: Verify Python dependencies
        run: python -m pip check
      - name: Python lint
        run: python -m ruff check app engine agent tests
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-tiny
          key: windows-whisper-tiny-v1
      - name: Prepare public CPU ASR test model
        env:
          HF_HUB_OFFLINE: '0'
        run: python -c "from faster_whisper.utils import download_model; download_model('tiny')"
      - name: Python regression
        run: python -m pytest -q

  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install frontend test environment
        run: npm ci
      - name: Install test browser
        run: npx playwright install chromium
      - name: JavaScript regression
        run: npm test
      - name: UI smoke
        run: npm run test:ui

  agent:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated Agent environment
        run: python -m pip install --require-hashes -r requirements-agent.lock.txt
      - name: Install Agent development tools
        run: python -m pip install -r requirements-agent-build.txt
      - name: Agent CLI and MCP regression
        run: python -m pytest -q tests/test_agent_control.py tests/test_agent_cli.py tests/test_agent_client.py tests/test_agent_mcp_adapter.py tests/test_agent_security.py tests/test_agent_integration.py tests/test_agent_control_config.py tests/test_agent_operations.py tests/test_agent_application_integration.py tests/test_agent_settings_bridge.py tests/test_agent_beta_card.py
      - name: Build Agent
        run: python -m PyInstaller --noconfirm build/agent.spec
      - name: Packaged Agent regression
        env:
          SHENGJIAN_AGENT_TEST_EXE: ${{ github.workspace }}/dist/FoilPage-Agent/FoilPage-Agent.exe
        run: python -m pytest -q tests/test_agent_integration.py tests/test_agent_application_integration.py
