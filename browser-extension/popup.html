<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoilPage</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="brand"><img class="mark" src="icons/icon-48.png" alt="">FoilPage</h1>
      <div id="connection" class="connection" role="status"><span class="connection-dot" aria-hidden="true"></span><span class="visually-hidden">桌面连接：</span><span id="connectionText">正在检查</span></div>
    </header>
    <section id="connectionPanel" class="connection-panel" aria-labelledby="connectionHeading" hidden>
      <h2 id="connectionHeading"></h2>
      <p id="message" class="message" role="status"></p>
      <div class="connection-actions">
        <button id="openApp" class="action action-primary" type="button" hidden>打开桌面连接页</button>
        <a id="launchApp" class="action action-primary" href="foilpage://launch" hidden>打开 FoilPage</a>
        <button id="connect" class="action" type="button" disabled>连接 FoilPage</button>
      </div>
    </section>
    <p id="versionNote" class="message version-note" role="status" hidden></p>
    <section id="pagePanel" class="page-panel" aria-labelledby="pageDesc" hidden>
      <p id="pagePlatform" class="page-platform" hidden></p>
      <h2 id="pageDesc" class="page-desc"></h2>
      <p id="pageHint" class="message" hidden>在抖音、B 站或 YouTube 打开具体视频后再使用扩展。</p>
      <div id="pageActions" class="page-actions" hidden>
        <button id="pageDownload" class="action page-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4" stroke-linecap="round" stroke-linejoin="round"/></svg>仅下载</button>
        <button id="pageTranscribe" class="action action-primary page-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Zm2 5h6m-6 4h6m-6 4h3" stroke-linecap="round" stroke-linejoin="round"/></svg>下载并转写</button>
      </div>
      <p id="pageState" class="page-state" role="status" aria-live="polite" hidden></p>
    </section>
    <section id="jobsPanel" class="jobs-panel" aria-labelledby="jobsHeading" hidden>
      <div class="jobs-head">
        <h2 id="jobsHeading">最近任务<span id="jobsCount" class="jobs-count" hidden></span></h2>
        <button id="refreshJobs" class="icon-button" type="button" aria-label="刷新任务" title="刷新任务"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5m-4-4a8 8 0 0 1 13-3l2 2M4 17l2 2a8 8 0 0 0 13-3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p id="jobsStatus" class="message jobs-status" role="status"></p>
      <div id="jobs" class="jobs"></div>
    </section>
    <footer id="extensionVersion" class="version" hidden></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
